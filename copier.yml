_min_copier_version: "9.0.0"
_subdirectory: "template/{{ component }}"
# _exclude replaces Copier's defaults, so .git and .DS_Store are repeated.
_exclude:
  - .git
  - .DS_Store
  - .venv
  - node_modules
  - uv.lock
  - pnpm-lock.yaml
  - pubspec.lock
  - .dart_tool
  - build
  - dist
  - __pycache__
  - "*.pyc"
  - .pytest_cache
  - .ruff_cache
  - .ty_cache
  - .mypy_cache
  - coverage

# Convention: component-specific questions go below, gated with
#   when: "{{ component == '<c>' }}"
# and always carry a default so `--defaults` works.

component:
  type: str
  help: Which component to generate
  choices: [workspace, backend, frontend, mobile]
  default: workspace

project_name:
  type: str
  help: Human-readable project name
  default: My App

project_slug:
  type: str
  help: Kebab-case slug
  default: "{{ project_name | lower | regex_replace('[^a-z0-9]+', '-') | trim('-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]*$')) %}
    project_slug must start with a lowercase letter and contain only a-z, 0-9 and "-"
    {% endif %}

package_name:
  type: str
  help: Python/Dart package name
  default: "{{ project_slug | replace('-', '_') }}"

project_description:
  type: str
  help: One-line description
  default: ""

org_domain:
  type: str
  help: Reverse-DNS organisation domain
  default: com.example
  validator: >-
    {% if not (org_domain | regex_search('^[a-z][a-z0-9]*(\.[a-z][a-z0-9]*)+$')) %}
    org_domain must be reverse DNS, for example com.example
    {% endif %}

author_name:
  type: str
  help: Author name
  default: Your Name

author_email:
  type: str
  help: Author email
  default: you@example.com

# Tasks run on copy only (never on update), once per component repo.
# List form: Jinja renders each element, so no shell quoting of answers.
_tasks:
  - command: ["git", "init", "-b", "main"]
    when: "{{ _copier_operation == 'copy' and component == 'backend' }}"
  - command: ["sh", "-c", "[ ! -f pyproject.toml ] || uv lock"]
    when: "{{ _copier_operation == 'copy' and component == 'backend' }}"
  - command: ["git", "add", "-A"]
    when: "{{ _copier_operation == 'copy' and component == 'backend' }}"
  - command: ["git", "-c", "user.name={{ author_name }}", "-c", "user.email={{ author_email }}", "commit", "--allow-empty", "-m", "chore: initial commit"]
    when: "{{ _copier_operation == 'copy' and component == 'backend' }}"

  - command: ["git", "init", "-b", "main"]
    when: "{{ _copier_operation == 'copy' and component == 'frontend' }}"
  - command: ["sh", "-c", "[ ! -f package.json ] || pnpm install"]
    when: "{{ _copier_operation == 'copy' and component == 'frontend' }}"
  - command: ["git", "add", "-A"]
    when: "{{ _copier_operation == 'copy' and component == 'frontend' }}"
  - command: ["git", "-c", "user.name={{ author_name }}", "-c", "user.email={{ author_email }}", "commit", "--allow-empty", "-m", "chore: initial commit"]
    when: "{{ _copier_operation == 'copy' and component == 'frontend' }}"

  - command: ["git", "init", "-b", "main"]
    when: "{{ _copier_operation == 'copy' and component == 'mobile' }}"
  - command: ["sh", "-c", "if command -v flutter >/dev/null 2>&1 && [ -f Makefile ]; then make bootstrap; else echo 'WARNING: flutter not found (or no Makefile); run make bootstrap in mobile/ later'; fi"]
    when: "{{ _copier_operation == 'copy' and component == 'mobile' }}"
  - command: ["git", "add", "-A"]
    when: "{{ _copier_operation == 'copy' and component == 'mobile' }}"
  - command: ["git", "-c", "user.name={{ author_name }}", "-c", "user.email={{ author_email }}", "commit", "--allow-empty", "-m", "chore: initial commit"]
    when: "{{ _copier_operation == 'copy' and component == 'mobile' }}"

  - command: ["sh", "-c", "case \"$1\" in /*|*://*|gh:*|git@*) ;; *) echo 'ERROR: template source must be an absolute path or URL, got: '\"$1\" >&2; exit 1;; esac", "sh", "{{ _copier_answers._src_path }}"]
    when: "{{ _copier_operation == 'copy' and component == 'workspace' }}"
  - command: ["git", "init", "-b", "main"]
    when: "{{ _copier_operation == 'copy' and component == 'workspace' }}"
  - command: ["{{ _copier_python }}", "-m", "copier", "copy", "--trust", "--defaults", "--vcs-ref", "{{ _copier_answers._commit }}", "-d", "component=backend", "-d", "project_name={{ project_name }}", "-d", "project_slug={{ project_slug }}", "-d", "project_description={{ project_description }}", "-d", "org_domain={{ org_domain }}", "-d", "author_name={{ author_name }}", "-d", "author_email={{ author_email }}", "{{ _copier_answers._src_path }}", "backend"]
    when: "{{ _copier_operation == 'copy' and component == 'workspace' }}"
  - command: ["{{ _copier_python }}", "-m", "copier", "copy", "--trust", "--defaults", "--vcs-ref", "{{ _copier_answers._commit }}", "-d", "component=frontend", "-d", "project_name={{ project_name }}", "-d", "project_slug={{ project_slug }}", "-d", "project_description={{ project_description }}", "-d", "org_domain={{ org_domain }}", "-d", "author_name={{ author_name }}", "-d", "author_email={{ author_email }}", "{{ _copier_answers._src_path }}", "frontend"]
    when: "{{ _copier_operation == 'copy' and component == 'workspace' }}"
  - command: ["{{ _copier_python }}", "-m", "copier", "copy", "--trust", "--defaults", "--vcs-ref", "{{ _copier_answers._commit }}", "-d", "component=mobile", "-d", "project_name={{ project_name }}", "-d", "project_slug={{ project_slug }}", "-d", "project_description={{ project_description }}", "-d", "org_domain={{ org_domain }}", "-d", "author_name={{ author_name }}", "-d", "author_email={{ author_email }}", "{{ _copier_answers._src_path }}", "mobile"]
    when: "{{ _copier_operation == 'copy' and component == 'workspace' }}"
  - command: ["git", "add", "-A"]
    when: "{{ _copier_operation == 'copy' and component == 'workspace' }}"
  - command: ["git", "-c", "user.name={{ author_name }}", "-c", "user.email={{ author_email }}", "commit", "--allow-empty", "-m", "chore: initial commit"]
    when: "{{ _copier_operation == 'copy' and component == 'workspace' }}"

_message_after_update: |
  Template updated. Lockfiles are not managed by the template; relock in each repo you updated:
    backend/   uv lock
    frontend/  pnpm install
    mobile/    flutter pub get
