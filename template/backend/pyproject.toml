[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.150,<0.151",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic[email]>=2.14,<2.15",
    "pydantic-settings>=2.16,<2.17",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32,<0.33",
    "alembic>=1.20,<1.21",
    "taskiq[opentelemetry]>=0.13,<0.14",
    "taskiq-redis>=1.2,<1.3",
    "taskiq-fastapi>=0.5,<0.6",
    "redis>=8.1,<8.2",
    "opentelemetry-sdk>=1.45,<1.46",
    "opentelemetry-exporter-otlp>=1.45,<1.46",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1,<0.67",
    "opentelemetry-instrumentation-asyncpg>=0.66b1,<0.67",
    "opentelemetry-instrumentation-redis>=0.66b1,<0.67",
    "opentelemetry-instrumentation-httpx>=0.66b1,<0.67",
    "structlog>=26.1,<26.2",
    "pwdlib[argon2]>=0.3,<0.4",
    "pyjwt>=2.15,<2.16",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<9.2",
    "pytest-asyncio>=1.4,<1.5",
    "httpx>=0.28,<0.29",
    "testcontainers[postgres,redis]>=4.15,<4.16",
    "ruff>=0.17,<0.18",
    "ty>=0.0.90,<0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.terminal]
error-on-warning = true
