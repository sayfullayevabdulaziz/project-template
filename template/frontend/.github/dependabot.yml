version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned ~6.0.3: a minor bump can break the toolchain; upgrade by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Exact pre-1.0 pin: every release can change generated output; bump by hand with a regeneration.
      - dependency-name: '@hey-api/openapi-ts'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
